name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: python3 -m unittest -v

      - name: Build both packages with makepkg
        run: ./build-in-arch.sh

      - name: .SRCINFO matches makepkg --printsrcinfo
        run: git diff --exit-code -- .SRCINFO nordlayer-bin/.SRCINFO
